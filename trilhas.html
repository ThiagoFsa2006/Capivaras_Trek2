<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trilhas - Capivaras Trek</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================
       ESTILOS DOS CARDS PADRONIZADOS
       ========================================== */
    .trilhas-list-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      margin: 20px 0;
    }

    .trilha-card {
      width: 100%;
      height: 200px; /* ALTURA FIXA IGUAL PARA TODOS OS CARDS */
      background: #ffffff;
      border: 1px solid #dcdfdc;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: row;
      align-items: stretch;
    }

    .trilha-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      border-color: #2d7a3e;
    }

    .trilha-img-box {
      width: 260px;
      min-width: 260px;
      height: 100%;
      background: #eef2ef;
      overflow: hidden;
    }

    .trilha-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
    }

    .no-image-placeholder {
      width: 100%;
      height: 100%;
      background-color: #e2e8e3;
      color: #7a8a7c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .trilha-info {
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-grow: 1;
    }

    .card-header-badge {
      display: flex;
      align-items: center;
      margin-bottom: 4px;
    }

    .badge-nivel {
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .trilha-titulo {
      color: #1b3320;
      font-size: 1.4rem;
      font-weight: 800;
      margin: 2px 0 0 0;
      letter-spacing: -0.3px;
      line-height: 1.2;
    }

    /* ==========================================
       GRADE DE ALINHAMENTO PERFEITO (ÍCONE C/ ÍCONE)
       ========================================== */
    .trilha-details-grid {
      display: grid;
      /* 5 colunas perfeitamente alinhadas */
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px 12px;
      width: 100%;
      font-size: 0.82rem;
      color: #3d4a3f;
      /* Sem bordas ou linhas divisórias */
      border: none;
      padding: 0;
      margin: 0;
    }

    .grid-cell {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cell-icon {
      flex-shrink: 0;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
    }

    .cell-label {
      font-weight: 700;
      color: #1b3320;
    }

    .cell-value {
      color: #556357;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ESTILOS DO MODAL E ESTRUTURA GERAL */
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      background: #ffffff;
      padding: 14px 20px;
      border: 1px solid #dcdfdc;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .search-input {
      width: 100%;
      max-width: 320px;
      padding: 8px 14px;
      border: 1px solid #cbd2cc;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    .sort-select {
      padding: 8px 12px;
      border: 1px solid #cbd2cc;
      border-radius: 6px;
      font-size: 0.9rem;
      background-color: #ffffff;
      color: #1b3320;
      cursor: pointer;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 20px;
    }

    .modal-overlay.active { display: flex; }

    .modal-content {
      background: #ffffff;
      border-radius: 12px;
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      padding: 24px;
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 1.8rem;
      background: none;
      border: none;
      cursor: pointer;
      color: #556357;
    }

    /* RESPONSIVIDADE */
    @media (max-width: 992px) {
      .trilha-card {
        height: auto; /* Permite expansão em telas pequenas */
        min-height: 200px;
      }
      .trilha-details-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 768px) {
      .trilha-card {
        flex-direction: column;
        height: auto;
      }
      .trilha-img-box {
        width: 100%;
        min-width: 100%;
        height: 180px;
      }
      .trilha-details-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      .trilha-details-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Header Fixo -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand">
        <img src="logo.png" alt="Capivaras Trek Logo" class="logo-img">
        <span class="brand-name">Capivaras Trek</span>
      </a>

      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Abrir Menu">
        <span></span><span></span><span></span>
      </button>

      <nav class="nav-links" id="nav-links">
        <a href="index.html#home" onclick="closeMenu()">Home</a>
        <a href="index.html#sobre" onclick="closeMenu()">Sobre</a>
        <a href="trilhas.html" class="active" onclick="closeMenu()">Trilhas</a>
        <a href="galeria.html" onclick="closeMenu()">Galeria</a>
        <a href="tracklogs.html" onclick="closeMenu()">Tracklogs</a>
        <a href="calendario.html" onclick="closeMenu()">Calendário</a>
        <a href="contato.html" onclick="closeMenu()">Contato</a>
      </nav>
    </div>
  </header>

  <section class="page-header section" style="padding-top: 110px; padding-bottom: 25px; background-color: #1b3320; color: #ffffff; text-align: center;">
    <div class="container">
      <h1 style="font-size: 2.2rem; font-weight: 800; margin-bottom: 6px;">Histórico de Aventuras</h1>
      <p style="max-width: 700px; margin: 0 auto; color: #d0e0d2; font-size: 1rem;">
        Acompanhe nosso histórico de aventuras e informações completas das expedições.
      </p>
    </div>
  </section>

  <main class="section" style="padding-top: 30px;">
    <div class="container">

      <!-- Barra de Filtros e Ordenação -->
      <div class="filter-bar">
        <div style="display: flex; align-items: center; gap: 10px; flex-grow: 1;">
          <span>🔍</span>
          <input type="text" id="searchInput" class="search-input" placeholder="Buscar por nome da trilha..." oninput="filterAndRenderTrilhas()">
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
          <label for="sortSelect" style="font-size: 0.88rem; font-weight: 600; color: #1b3320; white-space: nowrap;">Ordenar por:</label>
          <select id="sortSelect" class="sort-select" onchange="filterAndRenderTrilhas()">
            <option value="data-desc">Data (Mais recente)</option>
            <option value="data-asc">Data (Mais antiga)</option>
            <option value="nome-asc">Nome (A-Z)</option>
            <option value="nome-desc">Nome (Z-A)</option>
          </select>
        </div>
      </div>

      <!-- Lista de Cards -->
      <div class="trilhas-list-container" id="trilhasList">
        <p style="padding: 20px; text-align: center; width: 100%;">Carregando dados da planilha...</p>
      </div>

    </div>
  </main>

  <!-- Modal Detalhado -->
  <div class="modal-overlay" id="trilhaModal">
    <div class="modal-content">
      <button class="modal-close" id="modalClose">&times;</button>
      <div id="modalImgContainer"></div>
      
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; margin-top: 10px;">
        <span id="modalNivel" class="badge-nivel"></span>
      </div>

      <h2 id="modalTitulo" style="color: #1b3320; font-size: 1.8rem; margin: 8px 0;"></h2>
      <div class="trilha-details-grid" id="modalDetailsGrid" style="margin-bottom: 16px; grid-template-columns: repeat(2, 1fr);"></div>
      <hr style="border: 0; border-top: 1px solid #e1e8e2; margin: 16px 0;">
      <h4 style="color: #1b3320; margin-bottom: 8px;">Descrição Detalhada</h4>
      <p id="modalDescricaoCompleta" style="color: #435245; line-height: 1.7; font-size: 0.95rem;"></p>
    </div>
  </div>

  <script>
    const GOOGLE_SHEET_PAGINA1_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSYLi9oSrKvebix3RSQ4L9705UZZS1z9duOlFyv8DzrTkAP34rniv2SEmi0NDfyK1KRjFns8UU8M3VI/pub?gid=0&single=true&output=csv';

    let trilhasData = [];

    function getBadgeColor(nivel) {
      const n = (nivel || '').toLowerCase().trim();
      if (n.includes('muito fácil') || n.includes('muito facil')) return '#059669';
      if (n.includes('fácil') || n.includes('facil')) return '#2d7a3e';
      if (n.includes('moderado')) return '#d97706';
      if (n.includes('muito difícil') || n.includes('muito dificil')) return '#7c3aed';
      if (n.includes('difícil') || n.includes('dificil')) return '#dc2626';
      return '#1b3320';
    }

    function parseCSV(text) {
      const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length < 2) return [];

      const splitLine = (line) => {
        const result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            result.push(current.trim().replace(/^"|"$/g, ''));
            current = '';
          } else {
            current += char;
          }
        }
        result.push(current.trim().replace(/^"|"$/g, ''));
        return result;
      };

      const headers = splitLine(lines[0]).map(h => h.toLowerCase().replace(/\s+/g, ''));

      return lines.slice(1).map(line => {
        const values = splitLine(line);
        const obj = {};
        headers.forEach((header, index) => {
          obj[header] = values[index] || '';
        });
        return obj;
      });
    }

    function parseDateToTimestamp(dateStr) {
      if (!dateStr) return 0;
      const parts = dateStr.trim().split('/');
      if (parts.length === 3) {
        return new Date(parts[2], parts[1] - 1, parts[0]).getTime();
      }
      return 0;
    }

    async function loadData() {
      const listContainer = document.getElementById('trilhasList');
      try {
        const response1 = await fetch(GOOGLE_SHEET_PAGINA1_URL);
        if (response1.ok) {
          const csvText1 = await response1.text();
          const parsed1 = parseCSV(csvText1);
          trilhasData = parsed1.map(obj => {
            return {
              nome: obj['nome'] || '',
              nivel: obj['nivel'] || '',
              foto: obj['foto'] || '',
              regiao: obj['regiao'] || '',
              distancia: obj['distance'] || obj['distancia'] || '',
              tempoMedio: obj['time'] || obj['tempomedio'] || obj['tempo'] || '',
              trailtype: obj['trailtype'] || '',
              elevationGain: obj['elevation_gain'] || '',
              elevationLoss: obj['elevation_loss'] || '',
              maxElevation: obj['max_elevation'] || obj['max_eleva'] || '',
              minElevation: obj['min_elevation'] || obj['min_eleva'] || '',
              resumo: obj['resumo'] || '',
              descricaoCompleta: obj['descricaocompleta'] || obj['descricao'] || '',
              data: obj['data'] || '',
              status: obj['status'] || '',
              qtdPessoas: obj['qtdpessoas'] || obj['pessoas'] || obj['numero de pessoas'] || ''
            };
          }).filter(t => t.nome !== '');
        }

        filterAndRenderTrilhas();
      } catch (err) {
        console.error("Erro ao carregar o CSV:", err);
        listContainer.innerHTML = '<p style="color: red; text-align: center; width: 100%;">Erro ao carregar as trilhas da planilha.</p>';
      }
    }

    function filterAndRenderTrilhas() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
      const sortValue = document.getElementById('sortSelect').value;
      const listContainer = document.getElementById('trilhasList');

      let filtered = trilhasData.filter(t => {
        const isRealizada = (t.status || '').toLowerCase().trim() === 'realizada';
        const matchesSearch = t.nome.toLowerCase().includes(searchTerm);
        return isRealizada && matchesSearch;
      });

      filtered.sort((a, b) => {
        if (sortValue === 'data-desc') return parseDateToTimestamp(b.data) - parseDateToTimestamp(a.data);
        if (sortValue === 'data-asc') return parseDateToTimestamp(a.data) - parseDateToTimestamp(b.data);
        if (sortValue === 'nome-asc') return a.nome.localeCompare(b.nome, 'pt-BR');
        if (sortValue === 'nome-desc') return b.nome.localeCompare(a.nome, 'pt-BR');
        return 0;
      });

      if (filtered.length === 0) {
        listContainer.innerHTML = '<p style="text-align: center; width: 100%; color: #556357;">Nenhuma trilha realizada encontrada.</p>';
        return;
      }

      listContainer.innerHTML = filtered.map((t) => {
        const badgeColor = getBadgeColor(t.nivel);
        const originalIndex = trilhasData.indexOf(t);

        const imageMarkup = t.foto 
          ? `<img src="${t.foto}" alt="${t.nome}" class="trilha-img" onerror="this.onerror=null; this.parentNode.innerHTML='<div class=\\'no-image-placeholder\\'>No Image</div>';">`
          : `<div class="no-image-placeholder">No Image</div>`;

        return `
          <article class="trilha-card" onclick="openModal(${originalIndex})">
            
            <div class="trilha-img-box">
              ${imageMarkup}
            </div>

            <div class="trilha-info">
              <div>
                <div class="card-header-badge">
                  <span class="badge-nivel" style="background-color: ${badgeColor};">${t.nivel || 'Moderado'}</span>
                </div>
                <h3 class="trilha-titulo">${t.nome}</h3>
              </div>
              
              <!-- GRID DE INFORMAÇÕES (5 COLUNAS - ALINHAMENTO ÍCONE C/ ÍCONE) -->
              <div class="trilha-details-grid">
                
                <!-- LINHA 1 -->
                <div class="grid-cell" title="Região: ${t.regiao || 'N/A'}">
                  <span class="cell-icon">📍</span>
                  <span class="cell-label">Região:</span>
                  <span class="cell-value">${t.regiao || ''}</span>
                </div>

                <div class="grid-cell" title="Distância: ${t.distancia || 'N/A'}">
                  <span class="cell-icon">🏷️</span>
                  <span class="cell-label">Distância:</span>
                  <span class="cell-value">${t.distancia || ''}</span>
                </div>

                <div class="grid-cell" title="Tempo: ${t.tempoMedio || 'N/A'}">
                  <span class="cell-icon">⏱️</span>
                  <span class="cell-label">Tempo:</span>
                  <span class="cell-value">${t.tempoMedio || ''}</span>
                </div>

                <div class="grid-cell" title="Data: ${t.data || 'N/A'}">
                  <span class="cell-icon">📅</span>
                  <span class="cell-label">Data:</span>
                  <span class="cell-value">${t.data || ''}</span>
                </div>

                <div class="grid-cell" title="Integrantes: ${t.qtdPessoas || 'N/A'}">
                  <span class="cell-icon">👥</span>
                  <span class="cell-label">Integrantes:</span>
                  <span class="cell-value">${t.qtdPessoas || ''}</span>
                </div>

                <!-- LINHA 2 -->
                <div class="grid-cell" title="Tipo: ${t.trailtype || 'N/A'}">
                  <span class="cell-icon">🔄</span>
                  <span class="cell-label">Tipo:</span>
                  <span class="cell-value">${t.trailtype || ''}</span>
                </div>

                <div class="grid-cell" title="Ganho Elev.: ${t.elevationGain || 'N/A'}">
                  <span class="cell-icon">📈</span>
                  <span class="cell-label">Ganho Elev.:</span>
                  <span class="cell-value">${t.elevationGain || ''}</span>
                </div>

                <div class="grid-cell" title="Perda Elev.: ${t.elevationLoss || 'N/A'}">
                  <span class="cell-icon">📉</span>
                  <span class="cell-label">Perda Elev.:</span>
                  <span class="cell-value">${t.elevationLoss || ''}</span>
                </div>

                <div class="grid-cell" title="Elev. Máx: ${t.maxElevation || 'N/A'}">
                  <span class="cell-icon">⛰️</span>
                  <span class="cell-label">Elev. Máx:</span>
                  <span class="cell-value">${t.maxElevation || ''}</span>
                </div>

                <div class="grid-cell" title="Elev. Mín: ${t.minElevation || 'N/A'}">
                  <span class="cell-icon">🏞️</span>
                  <span class="cell-label">Elev. Mín:</span>
                  <span class="cell-value">${t.minElevation || ''}</span>
                </div>

              </div>

            </div>

          </article>
        `;
      }).join('');
    }

    /* MODAL POP-UP */
    const modal = document.getElementById('trilhaModal');
    const modalClose = document.getElementById('modalClose');

    function openModal(index) {
      const trilha = trilhasData[index];
      if (!trilha) return;

      const badgeColor = getBadgeColor(trilha.nivel);

      const modalImgBox = document.getElementById('modalImgContainer');
      if (trilha.foto) {
        modalImgBox.innerHTML = `<img src="${trilha.foto}" alt="${trilha.nome}" style="width: 100%; height: 240px; object-fit: cover; border-radius: 8px; margin-bottom: 16px;" onerror="this.parentNode.innerHTML='<div class=\\'no-image-placeholder\\' style=\\'height:240px; border-radius:8px; margin-bottom:16px;\\'>No Image</div>';">`;
      } else {
        modalImgBox.innerHTML = `<div class="no-image-placeholder" style="height: 240px; border-radius: 8px; margin-bottom: 16px;">No Image</div>`;
      }

      document.getElementById('modalNivel').textContent = trilha.nivel || 'Moderado';
      document.getElementById('modalNivel').style.backgroundColor = badgeColor;
      document.getElementById('modalTitulo').textContent = trilha.nome;

      document.getElementById('modalDetailsGrid').innerHTML = `
        <div class="grid-cell"><span class="cell-icon">📍</span><span class="cell-label">Região:</span><span class="cell-value">${trilha.regiao || ''}</span></div>
        <div class="grid-cell"><span class="cell-icon">🏷️</span><span class="cell-label">Distância:</span><span class="cell-value">${trilha.distancia || ''}</span></div>
        <div class="grid-cell"><span class="cell-icon">⏱️</span><span class="cell-label">Tempo:</span><span class="cell-value">${trilha.tempoMedio || ''}</span></div>
        <div class="grid-cell"><span class="cell-icon">📅</span><span class="cell-label">Data:</span><span class="cell-value">${trilha.data || ''}</span></div>
        <div class="grid-cell"><span class="cell-icon">👥</span><span class="cell-label">Integrantes:</span><span class="cell-value">${trilha.qtdPessoas || ''}</span></div>
        <div class="grid-cell"><span class="cell-icon">🔄</span><span class="cell-label">Tipo:</span><span class="cell-value">${trilha.trailtype || ''}</span></div>
        <div class="grid-cell"><span class="cell-icon">📈</span><span class="cell-label">Ganho Elev.:</span><span class="cell-value">${trilha.elevationGain || ''}</span></div>
        <div class="grid-cell"><span class="cell-icon">📉</span><span class="cell-label">Perda Elev.:</span><span class="cell-value">${trilha.elevationLoss || ''}</span></div>
        <div class="grid-cell"><span class="cell-icon">⛰️</span><span class="cell-label">Elev. Máx:</span><span class="cell-value">${trilha.maxElevation || ''}</span></div>
        <div class="grid-cell"><span class="cell-icon">🏞️</span><span class="cell-label">Elev. Mín:</span><span class="cell-value">${trilha.minElevation || ''}</span></div>
      `;

      document.getElementById('modalDescricaoCompleta').textContent = trilha.descricaoCompleta;
      modal.classList.add('active');
    }

    modalClose.addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('active');
    });

    loadData();

    /* MENU MOBILE */
    const mobileBtn = document.getElementById('mobile-menu-btn');
    const navLinks = document.getElementById('nav-links');

    mobileBtn.addEventListener('click', () => {
      mobileBtn.classList.toggle('active');
      navLinks.classList.toggle('active');
    });

    function closeMenu() {
      mobileBtn.classList.remove('active');
      navLinks.classList.remove('active');
    }
  </script>
</body>
</html>
